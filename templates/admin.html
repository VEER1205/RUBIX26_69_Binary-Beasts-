<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* Page Specific Overrides */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="top-nav"
      style="background:transparent; padding:0; box-shadow:none; margin-bottom:24px; border:none;">
      <h1><i class="fa-solid fa-hospital-user"></i> Command Center</h1>
      <button class="btn btn-danger" onclick="
            localStorage.clear();
            window.location.href = '/';
          ">
        <i class="fa-solid fa-sign-out-alt"></i> Logout
      </button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('staff')">
        <i class="fa-solid fa-user-doctor"></i> Staff Management
      </button>
      <button class="tab-btn" onclick="showTab('inventory')">
        <i class="fa-solid fa-boxes-stacked"></i> Inventory & Alerts
      </button>
      <button class="tab-btn" onclick="showTab('analytics')">
        <i class="fa-solid fa-chart-pie"></i> Live Analytics
      </button>
    </div>

    <div id="staff" class="section active">
      <div class="grid-2">
        <div class="card">
          <h3><i class="fa-solid fa-user-plus"></i> Add New Staff</h3>
          <form id="addStaffForm">
            <div class="form-group">
              <input type="text" id="fullname" placeholder=" " required />
              <label for="fullname">Full Name</label>
            </div>

            <div class="form-group">
              <input type="text" id="username" placeholder=" " required />
              <label for="username">Username</label>
            </div>

            <div class="form-group">
              <input type="password" id="password" placeholder=" " required />
              <label for="password">Password</label>
            </div>

            <div class="form-group">
              <select id="role" required>
                <option value="" disabled selected hidden></option>
                <option value="doctor">Doctor</option>
                <option value="receptionist">Receptionist</option>
              </select>
              <label for="role">Role Permission</label>
              <i class="fa-solid fa-chevron-down" style="
                    position: absolute;
                    right: 16px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--text-sec);
                    pointer-events: none;
                    font-size: 0.8rem;
                  "></i>
            </div>

            <button type="submit" class="action">
              <i class="fa-solid fa-plus-circle"></i> Create User Account
            </button>
          </form>
        </div>

        <div class="card">
          <h3>
            <i class="fa-solid fa-users-rectangle"></i> Active Staff Directory
          </h3>
          <div style="overflow-y: auto; flex: 1">
            <table id="staffTable">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Role</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="inventory" class="section">
      <div class="grid-2">
        <div class="card">
          <h3><i class="fa-solid fa-box-open"></i> Add Inventory Item</h3>
          <form id="addItemForm">
            <div class="form-group">
              <input type="text" id="itemName" placeholder=" " required />
              <label for="itemName">Item Name (e.g. Oxygen Mask)</label>
            </div>

            <div class="form-group">
              <select id="category" required>
                <option value="" disabled selected hidden></option>
                <option value="Medicine">Medicine</option>
                <option value="Equipment">Equipment</option>
              </select>
              <label for="category">Category</label>
              <i class="fa-solid fa-chevron-down" style="
                    position: absolute;
                    right: 16px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--text-sec);
                    pointer-events: none;
                    font-size: 0.8rem;
                  "></i>
            </div>

            <div class="form-group">
              <input type="number" id="qty" placeholder=" " required />
              <label for="qty">Quantity On Hand</label>
            </div>

            <div class="form-group">
              <input type="number" id="threshold" placeholder=" " value="10" required />
              <label for="threshold">Low Stock Alert Threshold</label>
            </div>

            <button type="submit" class="action">
              <i class="fa-solid fa-dolly"></i> Add to Inventory
            </button>
          </form>
        </div>

        <div class="card">
          <h3>
            <i class="fa-solid fa-clipboard-list"></i> Current Stock Status
          </h3>
          <div style="overflow-y: auto; flex: 1">
            <table id="invTable">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Qty</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="analytics" class="section">
      <div class="card" style="
            align-items: center;
            justify-content: center;
            min-height: 500px;
          ">
        <div style="width: 100%; max-width: 450px; text-align: center">
          <h3>
            <i class="fa-solid fa-bed-pulse"></i> Real-Time Bed Occupancy
          </h3>
          <div style="position: relative; margin-top: 20px">
            <canvas id="bedChart"></canvas>
            <div style="
                  position: absolute;
                  top: 50%;
                  left: 50%;
                  transform: translate(-50%, -50%);
                  pointer-events: none;
                  text-align: center;
                ">
              <i class="fa-solid fa-procedures" style="font-size: 2rem; color: var(--text-sec); opacity: 0.5"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const TOKEN = localStorage.getItem("token");
    if (!TOKEN) window.location.href = "/";

    // --- TAB LOGIC ---
    function showTab(id) {
      document
        .querySelectorAll(".section")
        .forEach((el) => el.classList.remove("active"));
      document
        .querySelectorAll(".tab-btn")
        .forEach((el) => el.classList.remove("active"));

      document.getElementById(id).classList.add("active");

      // Find the button that called this function (or match by text/id if needed, but event.target is simpler)
      const buttons = document.querySelectorAll(".tab-btn");
      if (id === "staff") buttons[0].classList.add("active");
      if (id === "inventory") buttons[1].classList.add("active");
      if (id === "analytics") buttons[2].classList.add("active");

      if (id === "inventory") loadInventory();
      if (id === "analytics") loadCharts();
      if (id === "staff") loadStaff();
    }

    // --- STAFF LOGIC ---
    async function loadStaff() {
      try {
        const res = await fetch(`${API}/hospital/staff/all`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const data = await res.json();
        document.querySelector("#staffTable tbody").innerHTML = data
          .map(
            (u) => `
            <tr>
                <td><div style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-user-circle" style="color:var(--primary)"></i> ${u.full_name}</div></td>
                <td><span style="color:var(--text-sec); text-transform:capitalize;">${u.role}</span></td>
            </tr>
        `,
          )
          .join("");
      } catch (e) {
        console.error("API Mock/Error", e);
      }
    }

    document
      .getElementById("addStaffForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          full_name: document.getElementById("fullname").value,
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
          role: document.getElementById("role").value,
        };

        try {
          const res = await fetch(`${API}/hospital/staff/add`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            alert("Staff member created successfully! 🎉");
            document.getElementById("addStaffForm").reset();
            loadStaff();
          } else {
            const err = await res.json();
            alert("Error: " + err.detail);
          }
        } catch (error) {
          console.error(error);
          alert("Network Error: Could not connect to server.");
        }
      });

    // --- INVENTORY LOGIC ---
    async function loadInventory() {
      try {
        const res = await fetch(`${API}/analytics/inventory`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const data = await res.json();

        const tbody = document.querySelector("#invTable tbody");
        tbody.innerHTML = "";

        data.forEach((item) => {
          let statusBadge = `<span class="badge status-ok"><i class="fa-solid fa-check"></i> OK</span>`;
          if (item.status === "LOW_STOCK")
            statusBadge = `<span class="badge status-low"><i class="fa-solid fa-triangle-exclamation"></i> LOW</span>`;
          if (item.status === "OUT_OF_STOCK")
            statusBadge = `<span class="badge status-out"><i class="fa-solid fa-xmark"></i> EMPTY</span>`;

          tbody.innerHTML += `
            <tr>
                <td style="font-weight:500;">${item.name}</td>
                <td>${item.qty}</td>
                <td>${statusBadge}</td>
            </tr>`;
        });
      } catch (e) {
        console.error("API Mock/Error", e);
      }
    }

    document
      .getElementById("addItemForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          item_name: document.getElementById("itemName").value,
          category: document.getElementById("category").value,
          quantity: +document.getElementById("qty").value,
          threshold: +document.getElementById("threshold").value,
        };
        try {
          await fetch(`${API}/analytics/inventory/add`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          loadInventory();
          document.getElementById("addItemForm").reset();
        } catch (e) {
          console.error(e);
        }
      });

    // --- CHARTS LOGIC ---
    let myChart = null;
    async function loadCharts() {
      try {
        const res = await fetch(`${API}/analytics/stats`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const stats = await res.json();

        const ctx = document.getElementById("bedChart").getContext("2d");
        if (myChart) myChart.destroy();

        Chart.defaults.color = "#94a3b8";
        Chart.defaults.font.family = "system-ui";

        myChart = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["Available Beds", "Occupied Beds"],
            datasets: [
              {
                data: [stats.AVAILABLE, stats.OCCUPIED],
                backgroundColor: ["#10b981", "#ef4444"], // Success and Danger vars
                borderWidth: 0,
                hoverOffset: 4,
              },
            ],
          },
          options: {
            cutout: "70%",
            responsive: true,
            plugins: {
              legend: {
                position: "bottom",
                labels: {
                  color: "#e2e8f0", // var(--text)
                  padding: 20,
                  usePointStyle: true,
                  pointStyle: "circle",
                },
              },
            },
          },
        });
      } catch (e) {
        console.error("API Mock/Error", e);
      }
    }

    // Initial Load
    loadStaff();
  </script>
</body>

</html>
