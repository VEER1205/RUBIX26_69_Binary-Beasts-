<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Admin Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --danger: #ef4444;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
        font-family: "Inter", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* Layout */
      header {
        display: flex;
        justify-content: space-between;
        padding: 20px 40px;
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
      }
      header h1 {
        margin: 0;
        font-size: 24px;
        color: var(--primary);
      }
      header button {
        background: var(--danger);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      main {
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 30px;
      }

      /* Cards */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 30px;
      }
      .card h2 {
        margin-top: 0;
        color: var(--text);
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
        margin-bottom: 20px;
      }

      /* Form */
      input,
      select {
        width: 100%;
        background: #0f172a;
        border: 1px solid var(--border);
        color: white;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      button[type="submit"] {
        background: var(--primary);
        color: white;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        opacity: 0.9;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 15px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-size: 0.9em;
        text-transform: uppercase;
      }

      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: 600;
      }
      .role-doctor {
        background: rgba(59, 130, 246, 0.1);
        color: #60a5fa;
      }
      .role-receptionist {
        background: rgba(16, 185, 129, 0.1);
        color: #34d399;
      }

      .delete-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
      }
      .delete-btn:hover {
        background: rgba(239, 68, 68, 0.25);
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🏥 Hospital Admin Console</h1>
      <button onclick="logout()">Logout</button>
    </header>

    <main>
      <section class="card">
        <h2>Add New Staff</h2>
        <form id="addStaffForm">
          <label>Full Name</label>
          <input
            type="text"
            id="fullname"
            placeholder="e.g. Dr. Sarah Jones"
            required
          />

          <label>Username</label>
          <input
            type="text"
            id="username"
            placeholder="e.g. sarah_ cardio"
            required
          />

          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Min 6 chars"
            required
          />

          <label>Role</label>
          <select id="role" required>
            <option value="" disabled selected>Select Role...</option>
            <option value="doctor">Doctor</option>
            <option value="receptionist">Receptionist</option>
          </select>

          <button type="submit">Create Staff Account</button>
        </form>
      </section>

      <section class="card">
        <h2>Staff Directory</h2>
        <div style="overflow-x: auto">
          <table id="staffTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="4">Loading staff...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const API_URL = window.location.origin;
      const TOKEN = localStorage.getItem("token");

      if (!TOKEN) window.location.href = "/";

      // --- 1. Load Staff ---
      async function loadStaff() {
        try {
          const res = await fetch(`${API_URL}/hospital/staff/all`, {
            headers: { Authorization: `Bearer ${TOKEN}` },
          });
          const data = await res.json();
          const tbody = document.querySelector("#staffTable tbody");
          tbody.innerHTML = "";

          if (data.length === 0) {
            tbody.innerHTML =
              "<tr><td colspan='4' style='text-align:center; padding:20px; color:#94a3b8;'>No staff found. Add someone!</td></tr>";
            return;
          }

          data.forEach((user) => {
            // Determine Badge Style
            const roleClass =
              user.role === "doctor" ? "role-doctor" : "role-receptionist";
            const roleLabel =
              user.role === "doctor" ? "👨‍⚕️ Doctor" : "📝 Receptionist";

            tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:600;">${user.full_name}</td>
                        <td style="color:#94a3b8;">${user.username}</td>
                        <td><span class="badge ${roleClass}">${roleLabel}</span></td>
                        <td>
                            <button class="delete-btn" onclick="deleteStaff(${user.id})">Remove</button>
                        </td>
                    </tr>
                `;
          });
        } catch (error) {
          console.error(error);
          alert("Session expired or invalid. Please login again.");
          logout();
        }
      }

      // --- 2. Add Staff ---
      document
        .getElementById("addStaffForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const payload = {
            full_name: document.getElementById("fullname").value,
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value,
          };

          try {
            const res = await fetch(`${API_URL}/hospital/staff/add`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${TOKEN}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (res.ok) {
              alert("Staff member created successfully!");
              document.getElementById("addStaffForm").reset();
              loadStaff();
            } else {
              const err = await res.json();
              alert("Error: " + err.detail);
            }
          } catch (error) {
            alert("Network Error");
          }
        });

      // --- 3. Delete Staff ---
      async function deleteStaff(userId) {
        if (
          !confirm(
            "Are you sure you want to remove this staff member? This cannot be undone.",
          )
        )
          return;

        try {
          const res = await fetch(`${API_URL}/hospital/staff/${userId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${TOKEN}` },
          });

          if (res.ok) {
            loadStaff(); // Refresh list
          } else {
            const err = await res.json();
            alert("Error: " + err.detail);
          }
        } catch (error) {
          alert("Network Error");
        }
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/";
      }

      // Initial Load
      loadStaff();
    </script>
  </body>
</html>
