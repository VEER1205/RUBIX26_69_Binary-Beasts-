<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambulance - MediSync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* Page Specific Overrides */
    .container {
      max-width: 800px;
    }

    .animate-fade {
      animation: fadeIn 0.4s ease-out;
    }
  </style>
</head>

<body>
  <header class="navbar">
    <h1><i class="fa-solid fa-truck-medical"></i> Emergency Response</h1>
  </header>

  <div class="container animate-fade">
    <div class="hero">
      <p>Locate nearest facility & alert trauma teams instantly.</p>
    </div>

    <div class="card" style="position: sticky; top: 80px; z-index: 90; margin-bottom: 32px">
      <div class="form-group">
        <input type="text" id="locationInput" placeholder=" " />
        <label for="locationInput"><i class="fa-solid fa-magnifying-glass"></i> Enter Location (e.g.
          Borivali)...</label>
      </div>
    </div>

    <div id="results">
      <div style="text-align: center; padding: 40px; color: var(--text-sec)">
        <i class="fa-solid fa-map-location-dot" style="font-size: 2rem; margin-bottom: 16px; opacity: 0.5"></i>
        <p>Enter a location above to find hospitals.</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let allHospitals = [];

    // 1. Fetch All Hospitals on Load
    async function loadData() {
      try {
        const res = await fetch(`${API_URL}/dashboard/city-stats`);
        allHospitals = await res.json();
        renderList(allHospitals);
      } catch (e) {
        console.error(e);
      }
    }

    // 2. Filter Logic
    document
      .getElementById("locationInput")
      .addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allHospitals.filter(
          (h) =>
            h.location.toLowerCase().includes(query) ||
            h.hospital_name.toLowerCase().includes(query),
        );
        renderList(filtered);
      });

    // 3. Render Cards (MODIFIED LOGIC)
    function renderList(data) {
      const container = document.getElementById("results");
      if (data.length === 0) {
        container.innerHTML = `
        <div style="text-align: center; padding: 40px; color: var(--text-sec);">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; margin-bottom: 16px; opacity: 0.5;"></i>
            <p>No hospitals found in this area.</p>
        </div>`;
        return;
      }

      container.innerHTML = data
        .map((h) => {
          // LOGIC FOR FULL HOSPITAL
          const isFull = h.available_icu <= 0;
          const lowStock = h.available_icu < 2;

          // Determine Badge Style
          let badgeClass = "badge-icu";
          if (isFull) badgeClass += " critical";
          else if (lowStock) badgeClass += " low";

          // Determine Button State
          const btnState = isFull
            ? "disabled"
            : `onclick="sendAlert(${h.id}, '${h.hospital_name}')"`;
          const btnText = isFull
            ? "<i class='fa-solid fa-ban'></i> ICU FULL - REDIRECT"
            : "<i class='fa-solid fa-bell'></i> Alert Trauma Team";

          return `
        <div class="card animate-fade" style="${isFull ? "opacity: 0.7;" : ""}">
            <div class="hosp-header">
                <div>
                    <h3 class="hosp-name">${h.hospital_name}</h3>
                    <div class="hosp-loc"><i class="fa-solid fa-location-dot"></i> ${h.location}</div>
                </div>
                <div class="${badgeClass}">
                    <i class="fa-solid fa-bed-pulse"></i> ICU: ${h.available_icu}
                </div>
            </div>
            <button class="btn-panic" ${btnState}>
                ${btnText}
            </button>
        </div>
      `;
        })
        .join("");
    }

    // 4. Send Emergency Call
    async function sendAlert(hospId, hospName) {
      const eta = prompt(
        `🚑 EMERGENCY ALERT\n\nEnter ETA to ${hospName} (e.g. 10 mins):`,
        "10 mins",
      );
      if (!eta) return;

      const condition = prompt(
        `🚑 PATIENT STATUS\n\nEnter Condition (e.g. Cardiac Arrest):`,
        "Critical Trauma",
      );

      try {
        const payload = {
          hospital_id: hospId,
          driver_name: "Ambulance Unit #42",
          eta: eta,
          patient_condition: condition || "Unknown",
        };

        const res = await fetch(`${API_URL}/emergency/notify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.ok)
          alert(
            `✅ ALERT SENT TO ${hospName}!\n\nTrauma team has been notified.\nETA: ${eta}`,
          );
        else alert("❌ Failed to send alert. Check connection.");
      } catch (e) {
        alert("❌ Network Error. Contact Dispatch via Radio.");
      }
    }

    loadData();
  </script>
</body>

</html>
