<!doctype html>

<link rel="stylesheet" href="/static/css/style.css" />
<style>
  /* Page Specific */
  .container {
    align-items: center;
  }

  .card {
    max-width: 600px;
    text-align: center;
  }

  .status-title {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 8px 0;
  }

  .status-desc {
    color: var(--text-sec);
    font-size: 1.1rem;
    margin: 0 0 32px 0;
  }

  .status-icon {
    font-size: 5rem;
    margin-bottom: 24px;
    display: inline-block;
    transition: color 0.3s;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    text-align: left;
  }

  .info-box {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .info-label {
    display: block;
    color: var(--text-sec);
    font-size: 0.85rem;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .info-val {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }

  .animate-fade {
    animation: fadeIn 0.4s ease-out;
  }
</style>
</head>

<body>
  <header>
    <h1><i class="fa-solid fa-heart-pulse"></i> My Health Portal</h1> <button class="btn-logout" onclick="logout()"> <i
        class="fa-solid fa-right-from-bracket"></i> Logout </button>
  </header>

  <div class="container">
    <div class="card animate-fade">
      <div id="loading">
        <i class="fa-solid fa-circle-notch fa-spin"
          style="margin-bottom: 16px; font-size: 2rem; color: var(--primary);"></i>
        <p>Retrieving your health records...</p>
      </div>

      <div id="content" style="display: none;">
        <i id="mainIcon" class="status-icon fa-solid fa-circle-question"></i>
        <div id="statusTitle" class="status-title">Unknown Status</div>
        <p id="statusDesc" class="status-desc">Fetching details...</p>

        <div class="info-grid">
          <div class="info-box">
            <span class="info-label"><i class="fa-solid fa-user"></i> Patient Name</span>
            <span id="pName" class="info-val">-</span>
          </div>
          <div class="info-box">
            <span class="info-label"><i class="fa-solid fa-calendar-check"></i> Next Follow-up</span>
            <span id="pNext" class="info-val">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const TOKEN = localStorage.getItem('token');
    if (!TOKEN) window.location.href = "/";

    async function loadData() {
      try {
        const res = await fetch(`${API}/patient/me`, {
          headers: { 'Authorization': `Bearer ${TOKEN}` }
        });
        if (!res.ok) throw new Error("Failed to load");

        const data = await res.json();

        // Update UI Text
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('pName').innerText = data.full_name;
        document.getElementById('pNext').innerText = data.next_visit || "Not Scheduled";
        document.getElementById('statusTitle').innerText = data.status;
        document.getElementById('statusDesc').innerText = data.details;

        // Dynamic Icon & Styling
        const icon = document.getElementById('mainIcon');
        const title = document.getElementById('statusTitle');

        if (data.status === 'Admitted') {
          icon.className = 'status-icon fa-solid fa-bed-pulse';
          icon.style.color = 'var(--danger)';
          title.style.color = 'var(--danger)';
        } else if (data.status === 'In Queue') {
          icon.className = 'status-icon fa-solid fa-user-clock';
          icon.style.color = 'var(--warning)';
          title.style.color = 'var(--warning)';
        } else {
          icon.className = 'status-icon fa-solid fa-house-circle-check';
          icon.style.color = 'var(--success)';
          title.style.color = 'var(--success)';
        }

      } catch (e) {
        const loader = document.getElementById('loading');
        loader.innerHTML = `
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom: 16px;"></i>
        <p>Connection Error. Please try logging in again.</p>
      `;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "/";
    }

    loadData();
  </script>
</body>

</html>
