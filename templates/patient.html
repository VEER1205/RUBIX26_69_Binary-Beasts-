<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Health Status - MediSync</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* --- DESIGN SYSTEM START --- */
      :root {
        --bg: #0a0e17;
        --card: #141b2d;
        --border: #253347;
        --text: #e2e8f0;
        --text-sec: #94a3b8;
        --primary: #3b82f6;
        --primary-h: #2563eb;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .container {
        max-width: 800px;
        padding: 24px 16px;
        margin: 0 auto;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Cards */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: var(--shadow-sm);
        transition: transform 0.2s;
        text-align: center;
      }
      .card:hover {
        transform: translateY(-2px);
      }

      /* Navbar */
      header.navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      header.navbar h1 {
        margin: 0;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--primary);
      }

      /* Buttons */
      button {
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
      }

      .btn-logout {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-logout:hover {
        background: var(--danger);
        color: white;
      }

      /* Status Styles */
      .status-icon-large {
        font-size: 4rem;
        margin-bottom: 24px;
        display: inline-block;
      }

      .status-active .status-icon-large {
        color: var(--warning);
        animation: pulse 2s infinite;
      }

      .status-idle .status-icon-large {
        color: var(--text-sec);
        opacity: 0.5;
      }

      h2 {
        margin: 0 0 8px 0;
        color: var(--text);
      }
      p {
        color: var(--text-sec);
        margin: 0;
      }

      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 32px;
        text-align: left;
      }

      .info-box {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .info-label {
        font-size: 0.85rem;
        color: var(--text-sec);
        margin-bottom: 4px;
        display: block;
      }
      .info-value {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
      }

      /* Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }
      .animate-fade {
        animation: fadeIn 0.4s ease-out;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <h1><i class="fa-solid fa-heart-pulse"></i> My Health Portal</h1>
      <button class="btn-logout" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </header>

    <div class="container animate-fade">
      <div style="text-align: center; margin-bottom: 32px">
        <h2 style="font-size: 2rem">Welcome back</h2>
        <p>Track your real-time hospital status</p>
      </div>

      <div class="card">
        <div id="statusContent">
          <i
            class="fa-solid fa-circle-notch fa-spin status-icon-large"
            style="color: var(--primary)"
          ></i>
          <h2>Syncing Records...</h2>
          <p>Please wait while we check hospital admissions.</p>
        </div>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;
      const TOKEN = localStorage.getItem("token");
      const USER_ID = parseInt(localStorage.getItem("user_id"));
      const HOSP_ID = localStorage.getItem("hospital_id");

      if (!TOKEN) window.location.href = "/";

      async function checkStatus() {
        const content = document.getElementById("statusContent");

        if (!HOSP_ID) {
          renderIdleState();
          return;
        }

        try {
          const res = await fetch(`${API_URL}/hospital/${HOSP_ID}/queue`, {
            headers: { Authorization: `Bearer ${TOKEN}` },
          });

          if (!res.ok) throw new Error("Failed to fetch data");

          const queue = await res.json();
          const myEntry = queue.find((p) => p.patient_id === USER_ID);

          if (myEntry) {
            renderActiveState(myEntry);
          } else {
            renderIdleState();
          }
        } catch (error) {
          console.error(error);
          content.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation status-icon-large" style="color:var(--danger)"></i>
            <h2>Connection Error</h2>
            <p>Could not retrieve your status. Please try again.</p>
        `;
        }
      }

      function renderActiveState(entry) {
        const content = document.getElementById("statusContent");
        let statusColor = "var(--primary)";
        let icon = "fa-user-clock";

        if (entry.status === "ADMITTED") {
          statusColor = "var(--success)";
          icon = "fa-bed-pulse";
        }

        content.innerHTML = `
        <div class="status-active">
            <i class="fa-solid ${icon} status-icon-large" style="color:${statusColor}"></i>
            <h2 style="color:${statusColor}">Active Ticket Found</h2>
            <p>You are currently in the system queue.</p>
            
            <div class="info-grid">
                <div class="info-box">
                    <span class="info-label">Priority Score</span>
                    <div class="info-value" style="color:var(--warning)">
                        <i class="fa-solid fa-sort-amount-up"></i> ${entry.priority_score}
                    </div>
                </div>
                <div class="info-box">
                    <span class="info-label">Current Status</span>
                    <div class="info-value" style="text-transform:uppercase; font-size:1rem;">
                        ${entry.status}
                    </div>
                </div>
            </div>

            <div style="margin-top: 24px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-radius: var(--radius); color: var(--text-sec); font-size: 0.9rem;">
                <i class="fa-solid fa-circle-info"></i> Please wait in the designated waiting area until your name is called.
            </div>
        </div>
    `;
      }

      function renderIdleState() {
        const content = document.getElementById("statusContent");
        content.innerHTML = `
        <div class="status-idle">
            <i class="fa-solid fa-clipboard-check status-icon-large"></i>
            <h2>No Active Queue Ticket</h2>
            <p>You are not currently waiting in any queue.</p>
            <div style="margin-top: 24px;">
                <button class="action" onclick="window.location.reload()" style="background:var(--card); border:1px solid var(--border); color:var(--text); width:auto; display:inline-flex;">
                    <i class="fa-solid fa-rotate"></i> Refresh Status
                </button>
            </div>
            <p style="margin-top:20px; font-size:0.9rem; color:var(--text-sec);">If you need medical assistance, please proceed to the Reception desk.</p>
        </div>
    `;
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/";
      }

      // Init
      checkStatus();
    </script>
  </body>
</html>
