<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* Page Specific Overrides */
    .badge-admin {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-family: monospace;
    }

    .table-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-select {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .btn-select:hover {
      background: var(--primary);
      color: white;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .animate-fade {
      animation: fadeIn 0.4s ease-out;
    }
  </style>
</head>

<body>
  <div class="container animate-fade">
    <header>
      <h1><i class="fa-solid fa-shield-halved"></i> Super Admin Dashboard</h1>
      <button class="btn-logout" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </header>

    <div class="grid-2">
      <div class="card">
        <h2><i class="fa-solid fa-hospital-user"></i> Add New Hospital</h2>
        <form id="createHospForm">
          <div class="form-group">
            <input type="text" id="hospName" placeholder=" " required />
            <label for="hospName">Hospital Name</label>
          </div>

          <div class="form-group">
            <input type="text" id="location" placeholder=" " required />
            <label for="location">Location (City/Area)</label>
          </div>

          <div class="form-group">
            <input type="text" id="contact" placeholder=" " required />
            <label for="contact">Contact Number</label>
          </div>

          <div class="row-inputs">
            <div class="form-group">
              <input type="number" id="icuCount" placeholder=" " value="10" required />
              <label for="icuCount">ICU Beds</label>
            </div>
            <div class="form-group">
              <input type="number" id="genCount" placeholder=" " value="30" required />
              <label for="genCount">Gen Beds</label>
            </div>
          </div>

          <button type="submit" class="action">
            <i class="fa-solid fa-plus-circle"></i> Create Hospital
          </button>
        </form>
      </div>

      <div class="card">
        <h2><i class="fa-solid fa-user-lock"></i> Assign Hospital Admin</h2>
        <form id="createAdminForm">
          <div class="form-group">
            <input type="number" id="targetHospId" placeholder=" " readonly />
            <label for="targetHospId">Target Hospital ID (Select from list)</label>
            <i class="fa-solid fa-lock" style="
                  position: absolute;
                  right: 16px;
                  top: 50%;
                  transform: translateY(-50%);
                  color: var(--text-sec);
                "></i>
          </div>

          <div class="form-group">
            <input type="text" id="adminName" placeholder=" " required />
            <label for="adminName">Admin Full Name</label>
          </div>

          <div class="form-group">
            <input type="text" id="adminUser" placeholder=" " required />
            <label for="adminUser">Username</label>
          </div>

          <div class="form-group">
            <input type="password" id="adminPass" placeholder=" " required />
            <label for="adminPass">Password</label>
          </div>

          <button type="submit" class="action" style="background: var(--primary)">
            <i class="fa-solid fa-user-plus"></i> Create Admin Account
          </button>
        </form>
      </div>
    </div>

    <div class="card" style="margin-bottom: 24px">
      <h2>
        <i class="fa-regular fa-building"></i> Active Hospitals Registry
      </h2>
      <div style="overflow-x: auto">
        <table id="hospTable">
          <thead>
            <tr>
              <th width="80">ID</th>
              <th>Name</th>
              <th>Location</th>
              <th width="200">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-sec)">
                Loading records...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2><i class="fa-solid fa-users-gear"></i> Hospital Admins Registry</h2>
      <div style="overflow-x: auto">
        <table id="adminTable">
          <thead>
            <tr>
              <th width="80">ID</th>
              <th>Name</th>
              <th>Username</th>
              <th>Assigned Hospital</th>
              <th width="180">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-sec)">
                Loading records...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const TOKEN = localStorage.getItem("token");
    if (!TOKEN) window.location.href = "/";

    // --- LOAD HOSPITALS ---
    async function loadHospitals() {
      try {
        const res = await fetch(`${API_URL}/dashboard/city-stats`);
        const data = await res.json();
        const tbody = document.querySelector("#hospTable tbody");
        tbody.innerHTML = "";

        if (data.length === 0)
          tbody.innerHTML =
            "<tr><td colspan='4' style='text-align:center'>No data found</td></tr>";

        data.forEach((h) => {
          const hid = h.id || "?";
          tbody.innerHTML += `
            <tr>
                <td><span style="color:var(--text-sec)">#${hid}</span></td>
                <td style="font-weight:600">${h.hospital_name}</td>
                <td><i class="fa-solid fa-location-dot" style="color:var(--primary); margin-right:6px;"></i> ${h.location}</td>
                <td>
                    <button class="table-btn btn-select" onclick="selectHospital(${hid})">
                        <i class="fa-solid fa-check"></i> Select
                    </button>
                    <button class="table-btn btn-delete" onclick="deleteHospital(${hid})">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </td>
            </tr>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    // --- LOAD ADMINS ---
    async function loadAdmins() {
      try {
        const res = await fetch(`${API_URL}/super-admin/admins`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const data = await res.json();
        const tbody = document.querySelector("#adminTable tbody");
        tbody.innerHTML = "";

        if (data.length === 0)
          tbody.innerHTML =
            "<tr><td colspan='5' style='text-align:center'>No admins found</td></tr>";

        data.forEach((u) => {
          tbody.innerHTML += `
            <tr>
                <td><span style="color:var(--text-sec)">#${u.id}</span></td>
                <td style="font-weight:600">${u.full_name}</td>
                <td><span class="badge-admin"><i class="fa-solid fa-user-tag"></i> ${u.username}</span></td>
                <td>${u.hospital_name}</td>
                <td>
                    <button class="table-btn btn-delete" onclick="deleteAdmin(${u.id})">
                        <i class="fa-solid fa-ban"></i> Revoke Access
                    </button>
                </td>
            </tr>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    // --- ACTIONS ---
    function selectHospital(id) {
      const input = document.getElementById("targetHospId");
      input.value = id;
      window.scrollTo({ top: 0, behavior: "smooth" });
      // Trigger visual focus effect
      input.parentElement.style.borderColor = "var(--primary)";
      setTimeout(
        () => (input.parentElement.style.borderColor = "var(--border)"),
        1000,
      );
    }

    document
      .getElementById("createHospForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById("hospName").value,
          location: document.getElementById("location").value,
          contact_number: document.getElementById("contact").value,
          icu_bed_count: +document.getElementById("icuCount").value,
          general_bed_count: +document.getElementById("genCount").value,
        };
        await fetch(`${API_URL}/super-admin/hospital/add`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });
        alert("Hospital Created Successfully! 🎉");
        document.getElementById("createHospForm").reset();
        loadHospitals();
      });

    document
      .getElementById("createAdminForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          hospital_id: +document.getElementById("targetHospId").value,
          full_name: document.getElementById("adminName").value,
          username: document.getElementById("adminUser").value,
          password: document.getElementById("adminPass").value,
        };
        const res = await fetch(`${API_URL}/super-admin/create-admin`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          alert("Admin Created Successfully! 🛡️");
          document.getElementById("createAdminForm").reset();
          loadAdmins();
        } else {
          const d = await res.json();
          alert("Error: " + d.detail);
        }
      });

    async function deleteHospital(id) {
      if (
        !confirm(
          "Are you sure you want to delete this hospital? This cannot be undone.",
        )
      )
        return;
      await fetch(`${API_URL}/super-admin/hospital/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${TOKEN}` },
      });
      loadHospitals();
    }

    async function deleteAdmin(id) {
      if (!confirm("Are you sure you want to revoke access for this admin?"))
        return;
      const res = await fetch(`${API_URL}/super-admin/admin/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${TOKEN}` },
      });
      if (res.ok) loadAdmins();
      else alert("Error deleting admin");
    }

    function logout() {
      localStorage.clear();
      window.location.href = "/";
    }

    // Initial Load
    loadHospitals();
    loadAdmins();
  </script>
</body>

</html>
