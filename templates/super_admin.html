<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>

    <style>
    :root {
        --bg: #0f172a;
        --card: #1e293b; /* Slightly lighter for contrast */
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --radius: 16px;
    }

    * {
        box-sizing: border-box;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    header button {
        background: var(--danger);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }

    header button:hover {
        background: var(--danger-hover);
    }

    /* --- Layout --- */
    main {
        padding: 40px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .grid-layout {
        display: grid;
        /* Responsive Grid: Cards shrink to 350px before stacking */
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
        gap: 30px;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    /* --- Cards --- */
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 30px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
        margin-top: 0;
        font-size: 1.25rem;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
        color: var(--text);
    }

    /* --- Forms --- */
    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    input {
        background: #0f172a;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.2s;
        width: 100%;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .row {
        display: flex;
        gap: 15px;
    }

    .row input {
        width: 100%;
    }

    button[type="submit"] {
        background: var(--primary);
        color: white;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.2s;
    }

    button[type="submit"]:hover {
        background: var(--primary-hover);
    }

    /* --- Table --- */
    .table-container {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        text-align: left;
        padding: 15px;
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border);
    }

    td {
        padding: 15px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 0.95rem;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }

    .action-btn {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        border: none;
        margin-right: 5px;
    }

    .select-btn {
        background: rgba(59, 130, 246, 0.1);
        color: var(--primary);
        border: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .select-btn:hover {
        background: rgba(59, 130, 246, 0.2);
    }

    .delete-btn {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .delete-btn:hover {
        background: rgba(239, 68, 68, 0.2);
    }

    @media (max-width: 768px) {
        .grid-layout {
            grid-template-columns: 1fr;
        }
        main {
            padding: 20px;
        }
    }
    </style>
</head>

<body>
<header>
    <h1>🛡️ Platform Overview</h1>
    <button onclick="logout()">Logout</button>
</header>

<main class="grid-layout">
    <section class="card">
        <h2>Add New Hospital</h2>
        <form id="createHospForm">
            <input type="text" id="hospName" placeholder="Hospital Name (e.g. City Care)" required>
            <input type="text" id="location" placeholder="Location (e.g. Bandra)" required>
            <input type="text" id="contact" placeholder="Contact Number" required>
            <div class="row">
                <input type="number" id="icuCount" placeholder="ICU Beds" value="10">
                <input type="number" id="genCount" placeholder="Gen Beds" value="30">
            </div>
            <button type="submit">Create Hospital</button>
        </form>
    </section>

    <section class="card">
        <h2>Assign Hospital Admin</h2>
        <form id="createAdminForm">
            <input type="number" id="targetHospId" placeholder="ID (Select from list below)" readonly style="cursor: not-allowed; opacity: 0.7;">
            <input type="text" id="adminName" placeholder="Admin Full Name" required>
            <input type="text" id="adminUser" placeholder="Username" required>
            <input type="password" id="adminPass" placeholder="Password" required>
            <button type="submit">Create Admin</button>
        </form>
    </section>

    <section class="card full-width">
        <h2>Active Hospitals Registry</h2>
        <div class="table-container">
            <table id="hospTable">
                <thead>
                    <tr>
                        <th width="50">ID</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th width="150">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    // --- Configuration ---
    const API_URL = window.location.origin;
    const TOKEN = localStorage.getItem('token');
    
    // Security Check
    if (!TOKEN) window.location.href = "/";

    // --- 1. Load Hospitals ---
    async function loadHospitals() {
        try {
            const res = await fetch(`${API_URL}/dashboard/city-stats`);
            if (!res.ok) throw new Error("Failed to fetch data");
            
            const data = await res.json();
            const tbody = document.querySelector("#hospTable tbody");
            tbody.innerHTML = "";

            if(data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>No hospitals found. Add one above.</td></tr>";
                return;
            }

            data.forEach(h => {
                // Ensure ID exists (fallback to '?' if old data)
                const hospId = h.id || '?';
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${hospId}</strong></td>
                        <td>${h.hospital_name}</td>
                        <td>${h.location}</td>
                        <td>
                            <button class="action-btn select-btn" onclick="selectHospital(${hospId})">Select</button>
                            <button class="action-btn delete-btn" onclick="deleteHospital(${hospId})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
            document.querySelector("#hospTable tbody").innerHTML = `<tr><td colspan='4' style='color:red'>Error loading data. Is backend running?</td></tr>`;
        }
    }

    // --- Helper: Select ID for Admin Creation ---
    function selectHospital(id) {
        document.getElementById('targetHospId').value = id;
        // Optional: Scroll to top smoothly
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 2. Create Hospital ---
    document.getElementById('createHospForm').addEventListener('submit', async e => {
        e.preventDefault();
        
        // Get values explicitly
        const payload = {
            name: document.getElementById('hospName').value,
            location: document.getElementById('location').value,
            contact_number: document.getElementById('contact').value,
            icu_bed_count: parseInt(document.getElementById('icuCount').value),
            general_bed_count: parseInt(document.getElementById('genCount').value)
        };

        try {
            const res = await fetch(`${API_URL}/super-admin/hospital/add`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Hospital Created Successfully! 🎉");
                document.getElementById('createHospForm').reset();
                loadHospitals();
            } else {
                const err = await res.json();
                alert("Error: " + err.detail);
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    });

    // --- 3. Create Admin ---
    document.getElementById('createAdminForm').addEventListener('submit', async e => {
        e.preventDefault();
        
        const hospId = document.getElementById('targetHospId').value;
        if(!hospId) {
            alert("Please select a hospital from the list below first!");
            return;
        }

        const payload = {
            hospital_id: parseInt(hospId),
            full_name: document.getElementById('adminName').value,
            username: document.getElementById('adminUser').value,
            password: document.getElementById('adminPass').value
        };

        try {
            const res = await fetch(`${API_URL}/super-admin/create-admin`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert(`Admin Created for Hospital #${hospId}`);
                document.getElementById('createAdminForm').reset();
            } else {
                const err = await res.json();
                alert("Error: " + err.detail);
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    });

    // --- 4. Delete Hospital ---
    async function deleteHospital(id) {
        if (!confirm("⚠️ Are you sure? This will delete the hospital and all its data.")) return;
        
        try {
            const res = await fetch(`${API_URL}/super-admin/hospital/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            
            if(res.ok) {
                loadHospitals();
            } else {
                alert("Failed to delete hospital");
            }
        } catch (error) {
            alert("Error: " + error.message);
        }
    }

    // --- Logout ---
    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    // Initial Load
    loadHospitals();
</script>

</body>
</html>
