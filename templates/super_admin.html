<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Dashboard</title>
    </head>
<body>
    <header>
        <h1>🛡️ Platform Overview</h1>
        <button onclick="logout()">Logout</button>
    </header>

    <main class="grid-layout">
        <section class="card">
            <h2>Add New Hospital</h2>
            <form id="createHospForm">
                <input type="text" id="hospName" placeholder="Hospital Name" required>
                <input type="text" id="location" placeholder="Location" required>
                <input type="text" id="contact" placeholder="Contact" required>
                <div class="row">
                    <input type="number" id="icuCount" placeholder="ICU Beds" value="10">
                    <input type="number" id="genCount" placeholder="Gen Beds" value="30">
                </div>
                <button type="submit">Create Hospital</button>
            </form>
        </section>

        <section class="card">
            <h2>Assign Hospital Admin</h2>
            <form id="createAdminForm">
                <input type="number" id="targetHospId" placeholder="Hospital ID (See list below)" required>
                <input type="text" id="adminName" placeholder="Admin Name" required>
                <input type="text" id="adminUser" placeholder="Username" required>
                <input type="password" id="adminPass" placeholder="Password" required>
                <button type="submit">Create Admin</button>
            </form>
        </section>

        <section class="card full-width">
            <h2>Active Hospitals</h2>
            <table id="hospTable">
                <thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script>
        const API_URL = window.location.origin;
        const TOKEN = localStorage.getItem('token');
        if (!TOKEN) window.location.href = "/";

        // LOAD HOSPITALS
        async function loadHospitals() {
            const res = await fetch(`${API_URL}/dashboard/city-stats`);
            const data = await res.json();
            const tbody = document.querySelector("#hospTable tbody");
            tbody.innerHTML = "";
            
            data.forEach(h => {
                tbody.innerHTML += `
                    <tr>
                        <td>${h.id}</td>
                        <td>${h.hospital_name}</td>
                        <td>${h.location}</td>
                        <td>
                            <button onclick="document.getElementById('targetHospId').value = ${h.id}">Select</button>
                            <button onclick="deleteHospital(${h.id})" style="color:red">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // CREATE HOSPITAL
        document.getElementById('createHospForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('hospName').value,
                location: document.getElementById('location').value,
                contact_number: document.getElementById('contact').value,
                icu_bed_count: parseInt(document.getElementById('icuCount').value),
                general_bed_count: parseInt(document.getElementById('genCount').value)
            };
            
            await fetch(`${API_URL}/super-admin/hospital/add`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            loadHospitals();
        });

        // CREATE ADMIN
        document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                hospital_id: parseInt(document.getElementById('targetHospId').value),
                full_name: document.getElementById('adminName').value,
                username: document.getElementById('adminUser').value,
                password: document.getElementById('adminPass').value
            };
            
            const res = await fetch(`${API_URL}/super-admin/create-admin`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if(res.ok) alert("Admin Created!");
        });

        // DELETE
        async function deleteHospital(id) {
            if(!confirm("Delete this hospital?")) return;
            await fetch(`${API_URL}/super-admin/hospital/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${TOKEN}` }
            });
            loadHospitals();
        }

        function logout() { localStorage.clear(); window.location.href = "/"; }
        loadHospitals();
    </script>
</body>
</html>
