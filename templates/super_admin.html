<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Dashboard</title>

    <style>
    :root {
        --bg: #0f172a;
        --card: #111827;
        --border: #1f2933;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #3b82f6;
        --danger: #ef4444;
        --radius: 18px;
    }

    * {
        box-sizing: border-box;
        font-family: "Inter", system-ui, sans-serif;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, #020617, #0f172a);
        color: var(--text);
        min-height: 100vh;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 48px;
        background: rgba(17, 24, 39, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }

    header h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.3px;
    }

    header button {
        background: var(--danger);
        border: none;
        color: white;
        padding: 14px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    main {
        padding: 48px;
        max-width: 1500px;
        margin: auto;
    }

    .grid-layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 36px;
    }

    .card {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 36px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    }

    .card h2 {
        margin: 0 0 24px 0;
        font-size: 22px;
        font-weight: 600;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    input {
        background: #020617;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 16px 18px;
        border-radius: 12px;
        font-size: 16px;
    }

    input::placeholder {
        color: var(--muted);
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .row {
        display: flex;
        gap: 16px;
    }

    button {
        background: var(--primary);
        border: none;
        color: white;
        padding: 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    thead {
        background: #020617;
    }

    th, td {
        padding: 18px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
    }

    th {
        color: var(--muted);
        font-weight: 600;
    }

    tbody tr:hover {
        background: rgba(59, 130, 246, 0.07);
    }

    td button {
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
        margin-right: 8px;
    }

    td button:last-child {
        background: var(--danger);
    }

    @media (max-width: 900px) {
        main {
            padding: 24px;
        }

        .grid-layout {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>
<header>
    <h1>🛡️ Platform Overview</h1>
    <button onclick="logout()">Logout</button>
</header>

<main class="grid-layout">
    <section class="card">
        <h2>Add New Hospital</h2>
        <form id="createHospForm">
            <input type="text" id="hospName" placeholder="Hospital Name" required>
            <input type="text" id="location" placeholder="Location" required>
            <input type="text" id="contact" placeholder="Contact" required>
            <div class="row">
                <input type="number" id="icuCount" placeholder="ICU Beds" value="10">
                <input type="number" id="genCount" placeholder="Gen Beds" value="30">
            </div>
            <button type="submit">Create Hospital</button>
        </form>
    </section>

    <section class="card">
        <h2>Assign Hospital Admin</h2>
        <form id="createAdminForm">
            <input type="number" id="targetHospId" placeholder="Hospital ID" required>
            <input type="text" id="adminName" placeholder="Admin Name" required>
            <input type="text" id="adminUser" placeholder="Username" required>
            <input type="password" id="adminPass" placeholder="Password" required>
            <button type="submit">Create Admin</button>
        </form>
    </section>

    <section class="card full-width">
        <h2>Active Hospitals</h2>
        <table id="hospTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<!-- YOUR EXISTING SCRIPT (UNCHANGED) -->
<script>
    const API_URL = window.location.origin;
    const TOKEN = localStorage.getItem('token');
    if (!TOKEN) window.location.href = "/";

    async function loadHospitals() {
        const res = await fetch(`${API_URL}/dashboard/city-stats`);
        const data = await res.json();
        const tbody = document.querySelector("#hospTable tbody");
        tbody.innerHTML = "";

        data.forEach(h => {
            tbody.innerHTML += `
                <tr>
                    <td>${h.id}</td>
                    <td>${h.hospital_name}</td>
                    <td>${h.location}</td>
                    <td>
                        <button onclick="document.getElementById('targetHospId').value = ${h.id}">Select</button>
                        <button onclick="deleteHospital(${h.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById('createHospForm').addEventListener('submit', async e => {
        e.preventDefault();
        await fetch(`${API_URL}/super-admin/hospital/add`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: hospName.value,
                location: location.value,
                contact_number: contact.value,
                icu_bed_count: +icuCount.value,
                general_bed_count: +genCount.value
            })
        });
        loadHospitals();
    });

    document.getElementById('createAdminForm').addEventListener('submit', async e => {
        e.preventDefault();
        const res = await fetch(`${API_URL}/super-admin/create-admin`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                hospital_id: +targetHospId.value,
                full_name: adminName.value,
                username: adminUser.value,
                password: adminPass.value
            })
        });
        if (res.ok) alert("Admin Created!");
    });

    async function deleteHospital(id) {
        if (!confirm("Delete this hospital?")) return;
        await fetch(`${API_URL}/super-admin/hospital/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${TOKEN}` }
        });
        loadHospitals();
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    loadHospitals();
</script>
</body>
</html>
