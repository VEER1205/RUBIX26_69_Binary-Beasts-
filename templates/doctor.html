<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - MediSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --radius: 16px; }
        * { box-sizing: border-box; font-family: "Inter", sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; grid-template-columns: 350px 1fr 300px; } /* Added 3rd column for Inventory */

        /* --- COL 1: QUEUE --- */
        .queue-panel { background: rgba(17, 24, 39, 0.95); border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; height: 100vh; }
        .queue-panel h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .queue-card { background: #020617; border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .queue-card.critical { border-left: 4px solid var(--danger); }
        .queue-card button { width: 100%; background: var(--primary); border: none; padding: 10px; border-radius: 8px; color: white; cursor: pointer; margin-top: 10px; }

        /* --- COL 2: BEDS --- */
        .bed-panel { padding: 40px; overflow-y: auto; height: 100vh; border-right: 1px solid var(--border); }
        header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .bed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .bed-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .bed-occupied { border-top: 4px solid var(--danger); background: rgba(239, 68, 68, 0.05); }
        .bed-available { border-top: 4px solid var(--success); }
        .action-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin-top: 5px; font-weight: 600; }
        .btn-discharge { background: var(--danger); color: white; }

        /* --- COL 3: PHARMACY (NEW) --- */
        .inv-panel { background: #1e293b; padding: 25px; overflow-y: auto; height: 100vh; }
        .inv-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .inv-item:last-child { border-bottom: none; }
        .inv-name { font-weight: bold; display: block; }
        .inv-qty { font-size: 0.85em; color: var(--muted); }
        .use-btn { background: var(--success); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .use-btn:hover { background: #16a34a; }
        
        @media (max-width: 1200px) { body { grid-template-columns: 300px 1fr; } .inv-panel { display: none; /* Hide inventory on small screens or make it a modal */ } }
    </style>
</head>
<body>

    <aside class="queue-panel">
        <h2>Waiting List <span id="q-count">(0)</span></h2>
        <div id="queue-list">Loading...</div>
    </aside>

    <main class="bed-panel">
        <header>
            <h1>👨‍⚕️ Doctor Console</h1>
            <button onclick="logout()" style="background:var(--danger); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Logout</button>
        </header>

        <h3>🔴 ICU Beds</h3>
        <div class="bed-grid" id="icu-grid"></div>
        
        <h3 style="margin-top:30px;">🔵 General Beds</h3>
        <div class="bed-grid" id="gen-grid"></div>
    </main>

    <aside class="inv-panel">
        <h2>💊 Pharmacy</h2>
        <p style="color:var(--muted); font-size:0.9em; margin-bottom:20px;">Click to dispense to patient</p>
        <div id="inventory-list">Loading Stock...</div>
    </aside>

    <script>
        const API_URL = window.location.origin;
        const TOKEN = localStorage.getItem('token');
        const HOSP_ID = localStorage.getItem('hospital_id');

        if (!TOKEN) window.location.href = "/";

        // --- LOAD DATA ---
        async function refreshAll() {
            loadQueue();
            loadBeds();
            loadInventory(); // <--- New Function
        }

        async function loadInventory() {
            try {
                const res = await fetch(`${API_URL}/analytics/inventory`, { headers: { 'Authorization': `Bearer ${TOKEN}` }});
                const data = await res.json();
                const list = document.getElementById('inventory-list');
                
                if(data.length === 0) { list.innerHTML = "<p>No medicines in stock.</p>"; return; }
                
                list.innerHTML = "";
                data.forEach(item => {
                    // Disable button if out of stock
                    const disabled = item.qty <= 0 ? 'disabled style="background:#555; cursor:not-allowed;"' : '';
                    const label = item.qty <= 0 ? 'Out' : 'Use';
                    
                    list.innerHTML += `
                        <div class="inv-item">
                            <div>
                                <span class="inv-name">${item.name}</span>
                                <span class="inv-qty">Stock: ${item.qty}</span>
                            </div>
                            <button class="use-btn" ${disabled} onclick="useMedicine(${item.id}, '${item.name}')">${label}</button>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        // --- ACTIONS ---
        async function useMedicine(itemId, name) {
            const qty = prompt(`How many ${name} to dispense?`, "1");
            if (!qty) return;

            try {
                const res = await fetch(`${API_URL}/analytics/inventory/use`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item_id: itemId, quantity: parseInt(qty) })
                });
                
                const data = await res.json();
                if(res.ok) { 
                    alert(data.message); 
                    loadInventory(); // Update count immediately
                } else { 
                    alert("Error: " + data.detail); 
                }
            } catch(e) { alert("Network error"); }
        }

        // ... (Keep existing loadQueue, loadBeds, admitPatient, dischargePatient functions from previous turn) ...
        // Re-paste them here if you overwrote the file completely.
        
        async function loadQueue() {
            // (Same as previous turn)
            const res = await fetch(`${API_URL}/hospital/${HOSP_ID}/queue`, { headers: { 'Authorization': `Bearer ${TOKEN}` }});
            const queue = await res.json();
            document.getElementById('q-count').innerText = `(${queue.length})`;
            document.getElementById('queue-list').innerHTML = queue.map(p => `
                <div class="queue-card ${p.severity>=7?'critical':''}">
                    <h4>Patient #${p.patient_id}</h4>
                    <p>Sev: ${p.severity}</p>
                    <button onclick="admitPatient(${p.id})">Admit</button>
                </div>
            `).join('');
        }

        async function loadBeds() {
            // (Same as previous turn - simplified for brevity)
            const res = await fetch(`${API_URL}/hospital/${HOSP_ID}/beds`, { headers: { 'Authorization': `Bearer ${TOKEN}` }});
            const beds = await res.json();
            const icu = document.getElementById('icu-grid');
            const gen = document.getElementById('gen-grid');
            icu.innerHTML = ""; gen.innerHTML = "";
            
            beds.forEach(b => {
                const html = `
                    <div class="bed-card ${b.status==='OCCUPIED'?'bed-occupied':'bed-available'}">
                        <h3>${b.bed_number}</h3>
                        ${b.status==='OCCUPIED' ? `<button class="action-btn btn-discharge" onclick="dischargePatient(${b.id})">Discharge</button>` : 'Empty'}
                    </div>`;
                if(b.bed_type === 'ICU') icu.innerHTML += html; else gen.innerHTML += html;
            });
        }

        async function admitPatient(qid) {
             const type = confirm("ICU?") ? "ICU" : "GENERAL";
             await fetch(`${API_URL}/hospital/admit-patient`, {
                 method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`, 'Content-Type':'application/json'},
                 body: JSON.stringify({queue_id:qid, bed_type:type})
             });
             refreshAll();
        }

        async function dischargePatient(bid) {
             if(!confirm("Discharge?")) return;
             await fetch(`${API_URL}/hospital/discharge-patient/${bid}`, { method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`} });
             refreshAll();
        }

        function logout() { localStorage.clear(); window.location.href = "/"; }

        // Init
        refreshAll();
        setInterval(refreshAll, 5000);
    </script>
</body>
</html>
