<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hospital Admin - MediSync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --primary: #3b82f6;
        --danger: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
      }
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        min-height: 100vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
      }
      header h1 {
        margin: 0;
        font-size: 24px;
        color: var(--primary);
      }

      /* Navigation Tabs */
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }
      .tab-btn {
        background: var(--card);
        color: #94a3b8;
        border: 1px solid var(--border);
        padding: 12px 24px;
        cursor: pointer;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.2s;
      }
      .tab-btn:hover {
        border-color: var(--primary);
        color: var(--text);
      }
      .tab-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .section {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .section.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Grid & Cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 25px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
      }
      .card h3 {
        margin-top: 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      /* Forms */
      input,
      select {
        width: 100%;
        background: #020617;
        border: 1px solid var(--border);
        color: white;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      button.action {
        width: 100%;
        padding: 12px;
        background: var(--success);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      button.action:hover {
        opacity: 0.9;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: #94a3b8;
        font-size: 0.9em;
      }

      /* Status Badges */
      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: bold;
      }
      .ok {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
      }
      .low {
        background: rgba(245, 158, 11, 0.1);
        color: var(--warning);
        animation: pulse 1.5s infinite;
      }
      .out {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🏥 Hospital Command Center</h1>
      <button
        onclick="logout()"
        style="
          background: var(--danger);
          color: white;
          border: none;
          padding: 10px 20px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
        "
      >
        Logout
      </button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('analytics')">
        📊 Analytics
      </button>
      <button class="tab-btn" onclick="switchTab('inventory')">
        📦 Inventory
      </button>
      <button class="tab-btn" onclick="switchTab('staff')">
        👥 Staff Management
      </button>
    </div>

    <div id="analytics" class="section active">
      <div class="grid">
        <div
          class="card"
          style="display: flex; flex-direction: column; align-items: center"
        >
          <h3>Bed Occupancy</h3>
          <div style="height: 300px; width: 100%; max-width: 400px">
            <canvas id="bedChart"></canvas>
          </div>
        </div>
        <div class="card">
          <h3>Quick Alerts</h3>
          <div id="alertsArea">
            <p style="color: #94a3b8">System running normally.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="inventory" class="section">
      <div class="grid">
        <div class="card">
          <h3>Add Stock</h3>
          <form id="addItemForm">
            <input
              type="text"
              id="itemName"
              placeholder="Item Name (e.g. Paracetamol)"
              required
            />
            <select id="category">
              <option value="Medicine">Medicine</option>
              <option value="Equipment">Equipment</option>
              <option value="Supplies">Supplies</option>
            </select>
            <div style="display: flex; gap: 10px">
              <input type="number" id="qty" placeholder="Qty" required />
              <input
                type="number"
                id="threshold"
                placeholder="Low Alert (e.g. 10)"
                value="10"
              />
            </div>
            <button type="submit" class="action">Add Item</button>
          </form>
        </div>
        <div class="card">
          <h3>Current Inventory</h3>
          <div style="overflow-y: auto; max-height: 400px">
            <table id="invTable">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Qty</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="staff" class="section">
      <div class="grid">
        <div class="card">
          <h3>Register Staff</h3>
          <form id="addStaffForm">
            <input type="text" id="fullname" placeholder="Full Name" required />
            <input type="text" id="username" placeholder="Username" required />
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
            <select id="role">
              <option value="doctor">Doctor</option>
              <option value="receptionist">Receptionist</option>
            </select>
            <button type="submit" class="action">Create User</button>
          </form>
        </div>
        <div class="card">
          <h3>Staff Directory</h3>
          <table id="staffTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API = window.location.origin;
      const TOKEN = localStorage.getItem("token");
      if (!TOKEN) window.location.href = "/";

      function switchTab(id) {
        document
          .querySelectorAll(".section")
          .forEach((el) => el.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        event.target.classList.add("active");
        refreshAll();
      }

      async function refreshAll() {
        loadCharts();
        loadInventory();
        loadStaff();
      }

      // --- CHARTS ---
      let bedChart = null;
      async function loadCharts() {
        try {
          const res = await fetch(`${API}/analytics/stats`, {
            headers: { Authorization: `Bearer ${TOKEN}` },
          });
          const stats = await res.json();

          const ctx = document.getElementById("bedChart").getContext("2d");
          if (bedChart) bedChart.destroy();

          bedChart = new Chart(ctx, {
            type: "doughnut",
            data: {
              labels: ["Available", "Occupied"],
              datasets: [
                {
                  data: [stats.AVAILABLE, stats.OCCUPIED],
                  backgroundColor: ["#10b981", "#ef4444"],
                  borderWidth: 0,
                },
              ],
            },
            options: {
              responsive: true,
              plugins: {
                legend: { position: "bottom", labels: { color: "#f1f5f9" } },
              },
            },
          });
        } catch (e) {
          console.error("Chart Error", e);
        }
      }

      // --- INVENTORY ---
      async function loadInventory() {
        const res = await fetch(`${API}/analytics/inventory`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const data = await res.json();
        const tbody = document.querySelector("#invTable tbody");
        tbody.innerHTML = "";
        const alerts = document.getElementById("alertsArea");
        alerts.innerHTML = "";

        data.forEach((i) => {
          let badge = `<span class="badge ok">OK</span>`;
          if (i.status === "LOW_STOCK") {
            badge = `<span class="badge low">LOW</span>`;
            alerts.innerHTML += `<p style="color:#f59e0b">⚠️ Low Stock: ${i.name} (${i.qty} left)</p>`;
          }
          if (i.status === "OUT_OF_STOCK") {
            badge = `<span class="badge out">EMPTY</span>`;
            alerts.innerHTML += `<p style="color:#ef4444">❌ Out of Stock: ${i.name}</p>`;
          }

          tbody.innerHTML += `<tr><td>${i.name}</td><td>${i.category || "-"}</td><td>${i.qty}</td><td>${badge}</td></tr>`;
        });
        if (!alerts.innerHTML)
          alerts.innerHTML = "<p style='color:#94a3b8'>All systems normal.</p>";
      }

      document
        .getElementById("addItemForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            item_name: document.getElementById("itemName").value,
            category: document.getElementById("category").value,
            quantity: +document.getElementById("qty").value,
            threshold: +document.getElementById("threshold").value,
          };
          await fetch(`${API}/analytics/inventory/add`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          loadInventory();
          document.getElementById("addItemForm").reset();
        });

      // --- STAFF ---
      async function loadStaff() {
        const res = await fetch(`${API}/hospital/staff/all`, {
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        const data = await res.json();
        document.querySelector("#staffTable tbody").innerHTML = data
          .map(
            (u) => `
                <tr>
                    <td>${u.full_name}</td>
                    <td style="text-transform:capitalize">${u.role}</td>
                    <td><button onclick="removeStaff(${u.id})" style="background:none; border:none; color:#ef4444; cursor:pointer;">✖ Remove</button></td>
                </tr>
            `,
          )
          .join("");
      }

      async function removeStaff(id) {
        if (!confirm("Remove staff?")) return;
        await fetch(`${API}/hospital/staff/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${TOKEN}` },
        });
        loadStaff();
      }

      document
        .getElementById("addStaffForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            full_name: document.getElementById("fullname").value,
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value,
          };
          const res = await fetch(`${API}/hospital/staff/add`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            loadStaff();
            document.getElementById("addStaffForm").reset();
            alert("Staff Added");
          } else {
            alert("Error adding staff");
          }
        });

      function logout() {
        localStorage.clear();
        window.location.href = "/";
      }

      // Init
      refreshAll();
    </script>
  </body>
</html>
