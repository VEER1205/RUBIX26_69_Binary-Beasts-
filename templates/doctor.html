<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - MediSync</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --radius: 16px; }
        * { box-sizing: border-box; font-family: "Inter", sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; grid-template-columns: 350px 1fr; }

        /* --- LEFT: QUEUE --- */
        .queue-panel { background: rgba(17, 24, 39, 0.95); border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; height: 100vh; }
        .queue-panel h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .queue-card { background: #020617; border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .queue-card.critical { border-left: 4px solid var(--danger); }
        .queue-card h4 { margin: 0 0 5px 0; }
        .queue-card button { width: 100%; background: var(--primary); border: none; padding: 10px; border-radius: 8px; color: white; cursor: pointer; margin-top: 10px; }

        /* --- RIGHT: BEDS --- */
        .bed-panel { padding: 40px; overflow-y: auto; height: 100vh; }
        header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        header button { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

        .bed-section { margin-bottom: 40px; }
        .bed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        .bed-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; position: relative; }
        
        /* Status Colors */
        .bed-available { border-top: 4px solid var(--success); }
        .bed-occupied { border-top: 4px solid var(--danger); background: rgba(239, 68, 68, 0.05); }

        .bed-number { font-size: 1.2em; font-weight: 700; display: block; margin-bottom: 10px; }
        .patient-info { font-size: 0.9em; color: var(--muted); margin-bottom: 15px; }
        .patient-id { color: var(--text); font-weight: bold; font-size: 1.1em; }

        /* Action Buttons */
        .action-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin-top: 5px; font-weight: 600; }
        .btn-discharge { background: var(--danger); color: white; }
        .btn-shift { background: var(--warning); color: #000; }

        @media (max-width: 900px) { body { grid-template-columns: 1fr; } .queue-panel { height: auto; border-right: none; border-bottom: 1px solid var(--border); } }
    </style>
</head>
<body>

    <aside class="queue-panel">
        <h2>Waiting List <span id="q-count">(0)</span></h2>
        <div id="queue-list">Loading...</div>
    </aside>

    <main class="bed-panel">
        <header>
            <h1>👨‍⚕️ Doctor Console</h1>
            <button onclick="logout()">Logout</button>
        </header>

        <div class="bed-section">
            <h3>🔴 ICU Beds</h3>
            <div class="bed-grid" id="icu-grid">Loading Beds...</div>
        </div>

        <div class="bed-section">
            <h3>🔵 General Beds</h3>
            <div class="bed-grid" id="gen-grid">Loading Beds...</div>
        </div>
    </main>

    <script>
        const API_URL = window.location.origin;
        const TOKEN = localStorage.getItem('token');
        const HOSP_ID = localStorage.getItem('hospital_id');

        if (!TOKEN) window.location.href = "/";

        // --- 1. LOAD PATIENT QUEUE ---
        async function loadQueue() {
            try {
                const res = await fetch(`${API_URL}/hospital/${HOSP_ID}/queue`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const queue = await res.json();
                
                const list = document.getElementById('queue-list');
                document.getElementById('q-count').innerText = `(${queue.length})`;
                list.innerHTML = queue.length ? "" : "<p style='color:#666'>No patients waiting.</p>";

                queue.forEach(p => {
                    const isCritical = p.severity >= 7;
                    list.innerHTML += `
                        <div class="queue-card ${isCritical ? 'critical' : ''}">
                            <h4>Patient #${p.patient_id}</h4>
                            <p>Severity: ${p.severity} | Score: ${p.priority_score}</p>
                            <button onclick="admitPatient(${p.id})">Admit Patient</button>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        // --- 2. LOAD BEDS (NEW) ---
        async function loadBeds() {
            try {
                const res = await fetch(`${API_URL}/hospital/${HOSP_ID}/beds`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const beds = await res.json();

                const icuGrid = document.getElementById('icu-grid');
                const genGrid = document.getElementById('gen-grid');
                icuGrid.innerHTML = "";
                genGrid.innerHTML = "";

                beds.forEach(bed => {
                    const isOccupied = bed.status === "OCCUPIED";
                    const statusClass = isOccupied ? 'bed-occupied' : 'bed-available';
                    
                    // Buttons Logic
                    let buttons = "";
                    if (isOccupied) {
                        const targetType = bed.bed_type === 'ICU' ? 'GENERAL' : 'ICU';
                        const targetLabel = bed.bed_type === 'ICU' ? 'General' : 'ICU';
                        
                        buttons = `
                            <button class="action-btn btn-shift" onclick="transferPatient(${bed.id}, '${targetType}')">⤵ Shift to ${targetLabel}</button>
                            <button class="action-btn btn-discharge" onclick="dischargePatient(${bed.id})">✖ Discharge</button>
                        `;
                    } else {
                        buttons = `<span style="color:var(--success); font-size:0.9em;">● Empty</span>`;
                    }

                    const cardHtml = `
                        <div class="bed-card ${statusClass}">
                            <span class="bed-number">${bed.bed_number}</span>
                            <div class="patient-info">
                                ${isOccupied ? `Patient ID: <span class="patient-id">#${bed.current_patient_id}</span>` : "Available"}
                            </div>
                            ${buttons}
                        </div>
                    `;

                    if(bed.bed_type === 'ICU') icuGrid.innerHTML += cardHtml;
                    else genGrid.innerHTML += cardHtml;
                });

            } catch(e) { console.error(e); }
        }

        // --- 3. ACTIONS ---

        async function admitPatient(queueId) {
            const bedType = confirm("Admit to ICU? (Cancel for General)") ? "ICU" : "GENERAL";
            try {
                const res = await fetch(`${API_URL}/hospital/admit-patient`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queue_id: queueId, bed_type: bedType })
                });
                const data = await res.json();
                if(res.ok) { alert(data.message); refreshAll(); }
                else alert(data.detail);
            } catch (e) { alert("Error admitting"); }
        }

        async function dischargePatient(bedId) {
            if(!confirm("Discharge this patient?")) return;
            try {
                const res = await fetch(`${API_URL}/hospital/discharge-patient/${bedId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                if(res.ok) { refreshAll(); }
            } catch (e) { alert("Error discharging"); }
        }

        async function transferPatient(bedId, targetType) {
            if(!confirm(`Shift patient to ${targetType} bed?`)) return;
            try {
                const res = await fetch(`${API_URL}/hospital/transfer-patient`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_bed_id: bedId, target_bed_type: targetType })
                });
                const data = await res.json();
                if(res.ok) { alert(data.message); refreshAll(); }
                else alert(data.detail);
            } catch (e) { alert("Error transferring"); }
        }

        function refreshAll() {
            loadQueue();
            loadBeds();
        }

        function logout() { localStorage.clear(); window.location.href = "/"; }

        // Start
        refreshAll();
        setInterval(refreshAll, 5000); // Live Updates
    </script>
</body>
</html>
